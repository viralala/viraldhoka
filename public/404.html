<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Lost | Viral Dhoka</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      @font-face { font-family: 'Boska'; src: url('/fonts/boska-400-italic.woff2') format('woff2'); font-style: italic; font-display: swap; }
      @font-face { font-family: 'General Sans'; src: url('/fonts/general-sans-500-normal.woff2') format('woff2'); font-weight: 500; font-display: swap; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; text-align: center; padding: 24px; background: #fbf6ec; color: #1b2350; font-family: 'General Sans', system-ui, sans-serif; font-weight: 500; }
      body::before { content: ''; position: fixed; inset: 0 0 auto; height: 28vh; background: conic-gradient(#f9c794 25%, transparent 0 50%, #f9c794 0 75%, transparent 0) 0 0 / 8px 8px; opacity: 0.5; mask: linear-gradient(#000, transparent); }
      body::after { content: ''; position: fixed; inset: auto 0 0; height: 28vh; background: conic-gradient(#a8d5b0 25%, transparent 0 50%, #a8d5b0 0 75%, transparent 0) 0 0 / 8px 8px; opacity: 0.6; mask: linear-gradient(transparent, #000); }
      main { position: relative; z-index: 1; }
      h1 { font-family: 'Boska', serif; font-style: italic; font-weight: 400; font-size: clamp(3rem, 11vw, 8rem); line-height: 1; letter-spacing: -0.03em; margin: 0 0 16px; }
      p { margin: 0 0 28px; color: #4b5379; }
      a { display: inline-flex; align-items: center; height: 52px; padding: 0 26px; border-radius: 999px; background: #1b2350; color: #fbf6ec; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>Mor got lost</h1>
      <p>This page does not exist. He knows the way back.</p>
      <a href="/">Back home</a>
    </main>
  </body>
</html>
