<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Lost | Viral Dhoka</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      @font-face { font-family: 'Boska'; src: url('/fonts/boska-400-italic.woff2') format('woff2'); font-style: italic; font-display: swap; }
      @font-face { font-family: 'General Sans'; src: url('/fonts/general-sans-500-normal.woff2') format('woff2'); font-weight: 500; font-display: swap; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; text-align: center; padding: 24px; background: #fcfbfe; color: #1b2350; font-family: 'General Sans', system-ui, sans-serif; font-weight: 500; }
      body::before { content: ''; position: fixed; inset: 0 0 auto; height: 28vh; background: conic-gradient(#f6bfd5 25%, transparent 0 50%, #f6bfd5 0 75%, transparent 0) 0 0 / 8px 8px; opacity: 0.5; mask: linear-gradient(#000, transparent); }
      body::after { content: ''; position: fixed; inset: auto 0 0; height: 28vh; background: conic-gradient(#a9c4f5 25%, transparent 0 50%, #a9c4f5 0 75%, transparent 0) 0 0 / 8px 8px; opacity: 0.6; mask: linear-gradient(transparent, #000); }
      main { position: relative; z-index: 1; }
      h1 { font-family: 'Boska', serif; font-style: italic; font-weight: 400; font-size: clamp(3rem, 11vw, 8rem); line-height: 1; letter-spacing: -0.03em; margin: 0 0 16px; }
      p { margin: 0 0 28px; color: #4b5379; }
      a { display: inline-flex; align-items: center; height: 52px; padding: 0 26px; border-radius: 999px; background: #1b2350; color: #fcfbfe; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <h1 id="t">Mor got lost</h1>
      <p id="b">This page does not exist. He knows the way back.</p>
      <a id="h" href="/">Back home</a>
    </main>
    <script>
      // Same language as the rest of the site, picked from the saved choice
      var T = {
        hi: ['मोर रास्ता भटक गया', 'यह पेज मौजूद नहीं है। पर मोर को वापसी का रास्ता पता है।', 'होम पर वापस जाएँ'],
        mr: ['मोर वाट चुकला', 'हे पान अस्तित्वात नाही. पण मोराला परतीची वाट माहीत आहे.', 'मुख्य पानावर परत जा'],
        de: ['Mor hat sich verlaufen', 'Diese Seite gibt es nicht. Er kennt den Weg zurück.', 'Zur Startseite'],
        es: ['Mor se ha perdido', 'Esta página no existe. Él conoce el camino de vuelta.', 'Volver al inicio'],
        zh: ['莫尔迷路了', '这个页面不存在。不过莫尔认得回去的路。', '返回首页'],
        fr: ['Mor s’est perdu', 'Cette page n’existe pas. Il connaît le chemin du retour.', 'Retour à l’accueil'],
        ja: ['モルが迷子になりました', 'このページは存在しません。でもモルは帰り道を知っています。', 'ホームに戻る'],
      }
      try {
        var l = localStorage.getItem('vd-lang')
        if (T[l]) {
          document.documentElement.lang = l
          document.getElementById('t').textContent = T[l][0]
          document.getElementById('b').textContent = T[l][1]
          document.getElementById('h').textContent = T[l][2]
          document.title = T[l][0]
          document.body.style.fontFamily = "'General Sans', 'Nirmala UI', 'Microsoft YaHei', 'Yu Gothic', system-ui, sans-serif"
        }
      } catch (e) {}
    </script>
  </body>
</html>
